<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LAN Usage Monitor</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>LAN Internet Usage Monitor</h1>
      <div class="subtitle" id="last-refresh">Loading...</div>
    </div>
    <div class="range-picker" id="range-picker"></div>
  </header>

  <div class="client-grid" id="client-grid"></div>

  <div class="panels">
    <div class="panel">
      <h2 id="detail-title">All PCs</h2>
      <div id="timeseries"></div>
    </div>
    <div class="panel">
      <h2>Top sites by bandwidth</h2>
      <div id="top-domains"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
